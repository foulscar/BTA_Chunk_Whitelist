name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build release
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar_path=$(find build/libs -maxdepth 1 -type f -name 'chunkwhitelist-*.jar' ! -name '*-sources.jar' -print -quit)
          if [ -z "$jar_path" ]; then
            echo "Release JAR not found in build/libs" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar_path" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$jar_path" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
